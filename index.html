<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barnett Collection Object Identifier</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Barnett Collection Object Identifier</h1>

    <p>Upload a photograph of a collection item with its storage location identifier written on a note beside it.</p>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
    >

    <div>
        <img
            id="photoPreview"
            alt="Photograph preview"
        >
    </div>

    <h2>Detected location</h2>

    <p id="detectedLocation">
        No location detected yet.
    </p>

    <button id="findMatchButton" disabled>
        Find Match
    </button>

    <script src="app.js"></script>

</body>
</html>
